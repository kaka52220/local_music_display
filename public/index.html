<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地音乐播放器</title>
  <link rel="stylesheet" href="/styles/player.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ec4141' d='M12 3v10.55A4 4 0 1014 17V7h4V3z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">

    <!-- ============ 背景：封面氛围色 + 缓慢流动的光晕 ============ -->
    <div class="bg" aria-hidden="true">
      <div class="bg-tint" id="bg-tint"></div>
      <div class="bg-cover" id="bg-cover-a"></div>
      <div class="bg-cover" id="bg-cover-b"></div>
      <div class="bg-glow bg-glow-1"></div>
      <div class="bg-glow bg-glow-2"></div>
      <div class="bg-shade"></div>
      <div class="bg-grain"></div>
    </div>

    <!-- ============ 顶部：左上角歌单入口 / 右上角布局样式 ============ -->
    <header class="topbar">
      <button class="ghost-btn" id="btn-sheet" aria-label="打开歌单" aria-haspopup="dialog" aria-expanded="false" title="歌单"></button>
      <button class="ghost-btn" id="btn-layout" aria-label="布局样式" aria-haspopup="dialog" aria-expanded="false" title="布局样式"></button>
    </header>

    <!-- ============ 舞台：唱片（固定底座 + 滑动黑胶 + 唱臂）/ 信息 + 歌词 ============ -->
    <main class="stage">
      <section class="disc-col" id="disc-col">
        <div class="disc-area">
        <div class="disc-stage" id="disc-stage" aria-label="左右拖动唱片切换歌曲" title="左右拖动唱片切换歌曲">
          <!-- 浅色半透明底座：固定不动，切歌时只有黑胶在滑 -->
          <div class="disc-base" aria-hidden="true"></div>
          <div class="disc-slot"></div>
          <div class="disc-slot"></div>
          <div class="disc-slot"></div>
          <!-- 唱臂：viewBox 0 -34 100 134（底座直径 = 100），转轴 (50,-20) -->
          <div class="tonearm" id="tonearm" aria-hidden="true">
            <svg viewBox="0 -34 100 134">
              <defs>
                <radialGradient id="ta-knob" cx=".36" cy=".32" r=".75">
                  <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e4e6e9"/><stop offset="1" stop-color="#a3a9b0"/>
                </radialGradient>
                <radialGradient id="ta-cap" cx=".4" cy=".35" r=".7">
                  <stop offset="0" stop-color="#f7f8f9"/><stop offset="1" stop-color="#bfc4ca"/>
                </radialGradient>
                <linearGradient id="ta-weight" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#7d838a"/><stop offset=".32" stop-color="#eef0f2"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".78" stop-color="#b9bec4"/><stop offset="1" stop-color="#6f757c"/>
                </linearGradient>
                <linearGradient id="ta-collar" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#8e949b"/><stop offset=".45" stop-color="#f2f3f5"/><stop offset="1" stop-color="#868c93"/>
                </linearGradient>
                <linearGradient id="ta-shell" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#eceef1"/><stop offset="1" stop-color="#b4b9c0"/>
                </linearGradient>
                <path id="ta-tube-path" d="M50 -20 C 50.4 -9, 51.6 -1.5, 54.8 5.2 C 57.6 11, 61.2 14.6, 65.4 17.2"/>
              </defs>
              <!-- 底座：深色圆盘 + 细高光边 -->
              <circle cx="50" cy="-20" r="6.6" fill="rgba(0,0,0,.2)"/>
              <circle cx="50" cy="-20" r="6.6" fill="none" stroke="rgba(255,255,255,.1)" stroke-width=".3"/>
              <!-- 配重：转轴后方伸出的圆柱 -->
              <path d="M50 -20 V -27.6" stroke="#aeb3b9" stroke-width="2" stroke-linecap="round"/>
              <rect x="46.4" y="-32.2" width="7.2" height="5" rx="1.3" fill="url(#ta-weight)"/>
              <path d="M46.6 -30.6 H53.4 M46.6 -29.2 H53.4 M46.6 -27.8 H53.4" stroke="rgba(0,0,0,.16)" stroke-width=".28"/>
              <rect x="46.4" y="-32.2" width="7.2" height="5" rx="1.3" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".25"/>
              <!-- 唱臂管：分层描边做出圆柱高光 -->
              <use href="#ta-tube-path" fill="none" stroke="#9fa5ac" stroke-width="2.3" stroke-linecap="round"/>
              <use href="#ta-tube-path" fill="none" stroke="#e9ebee" stroke-width="1.55" stroke-linecap="round" transform="translate(-.18 -.08)"/>
              <use href="#ta-tube-path" fill="none" stroke="#ffffff" stroke-width=".5" stroke-linecap="round" transform="translate(-.5 -.22)" opacity=".95"/>
              <!-- 关节套环 -->
              <g transform="translate(50.38 -10.6) rotate(3)">
                <rect x="-1.75" y="-.95" width="3.5" height="1.9" rx=".45" fill="url(#ta-collar)"/>
                <path d="M-1.75 0 H1.75" stroke="rgba(0,0,0,.18)" stroke-width=".22"/>
              </g>
              <!-- 唱头：连接颈 + 带散热纹的唱头壳 + 指拨 + 黑色唱头 -->
              <g transform="translate(65.4 17.2) rotate(32)">
                <rect x="-.9" y="-1.25" width="2.4" height="2.5" rx=".5" fill="url(#ta-collar)"/>
                <rect x="1.2" y="-.7" width="1.4" height="1.4" fill="#8f959c"/>
                <rect x="4.1" y="2" width="5.2" height="1.7" rx=".45" fill="#26282c"/>
                <rect x="8.2" y="3.5" width=".8" height=".7" rx=".2" fill="#c9a24a"/>
                <path d="M10.6 -2 Q 12.2 -2.6 13.1 -3.9" fill="none" stroke="#dfe2e6" stroke-width=".85" stroke-linecap="round"/>
                <rect x="2.4" y="-2.55" width="8.8" height="5.1" rx="1.15" fill="url(#ta-shell)"/>
                <rect x="2.4" y="-2.55" width="8.8" height="5.1" rx="1.15" fill="none" stroke="rgba(0,0,0,.16)" stroke-width=".25"/>
                <path d="M5.3 -1.7 V1.7 M6.5 -1.7 V1.7 M7.7 -1.7 V1.7" stroke="rgba(0,0,0,.2)" stroke-width=".32" stroke-linecap="round"/>
                <path d="M2.9 -2.05 H10.6" stroke="#fff" stroke-width=".35" stroke-linecap="round" opacity=".9"/>
              </g>
              <!-- 转轴旋钮：同心圆 + 高光 -->
              <circle cx="50" cy="-20" r="3.7" fill="url(#ta-knob)"/>
              <circle cx="50" cy="-20" r="3.7" fill="none" stroke="rgba(0,0,0,.2)" stroke-width=".25"/>
              <circle cx="50" cy="-20" r="2.45" fill="none" stroke="rgba(0,0,0,.14)" stroke-width=".28"/>
              <circle cx="50" cy="-20" r="1.55" fill="url(#ta-cap)"/>
              <circle cx="50" cy="-20" r=".6" fill="#8c9299"/>
              <circle cx="49.1" cy="-21" r=".7" fill="#fff" opacity=".8"/>
            </svg>
          </div>
        </div>
        </div>

        <!-- 分栏布局：唱片下方的歌曲信息 / 进度 / 控制（经典布局下隐藏） -->
        <div class="dock" id="dock">
          <div class="dock-meta">
            <div class="dock-text">
              <h2 class="dock-title" id="dock-title">未在播放</h2>
              <p class="dock-artist" id="dock-artist">&nbsp;</p>
            </div>
            <div class="dock-actions">
              <button class="icon-btn like-btn" id="btn-like" aria-label="喜欢" aria-pressed="false" title="喜欢"></button>
              <button class="icon-btn" id="btn-dock-lyric" aria-label="显示/隐藏歌词" title="歌词"></button>
            </div>
          </div>
          <div class="dock-progress" id="dock-progress">
            <div class="dock-slider" id="dock-slider"></div>
            <div class="dock-times"><span id="dock-cur">00:00</span><span id="dock-total">00:00</span></div>
          </div>
          <div class="dock-transport" id="dock-transport"></div>
        </div>
      </section>

      <section class="info-col" id="info-col">
        <div class="meta" id="meta">
          <h1 class="meta-title" id="big-title">未在播放</h1>
          <p class="meta-line" id="big-sub">&nbsp;</p>
          <div class="tabs" role="tablist">
            <button class="tab is-active" role="tab" aria-selected="true">歌词</button>
            <button class="tab" role="tab" aria-selected="false" disabled title="即将支持">百科</button>
            <button class="tab" role="tab" aria-selected="false" disabled title="即将支持">相似推荐</button>
          </div>
        </div>
        <!-- 分栏布局：歌词上方的署名信息 -->
        <div class="credits" id="credits"></div>
        <div class="lyrics-wrap" id="lyrics-wrap">
          <div class="lyrics-box" id="lyrics-box">
            <div class="lyrics-inner" id="lyrics-inner"></div>
          </div>
          <!-- 歌词拖动定位：时间 + 引导线/高亮行 + "从这里播放" -->
          <div class="scrub" id="scrub" aria-hidden="true">
            <span class="scrub-time" id="scrub-time">00:00</span>
            <span class="scrub-row"></span>
            <button class="scrub-play" id="scrub-play" tabindex="-1">点击从这里播放<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.6v12.8c0 .8.9 1.3 1.6.85l10-6.4a1 1 0 0 0 0-1.7l-10-6.4C8.9 4.3 8 4.8 8 5.6z"/></svg></button>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ 底部控制栏 ============ -->
    <footer class="bar">
      <div class="bar-progress">
        <input type="range" class="progress" id="now-slider" min="0" max="10000" step="1" value="0" aria-label="播放进度">
      </div>
      <div class="bar-left">
        <div class="bar-track">
          <span class="bar-title" id="bar-title">未在播放</span>
          <span class="bar-artist" id="bar-artist">&nbsp;</span>
        </div>
        <span class="bar-time"><span id="now-cur">00:00</span><i>/</i><span id="now-total">00:00</span></span>
      </div>
      <div class="bar-center" id="transport">
        <button class="icon-btn" id="now-mode" aria-label="播放模式"></button>
        <button class="icon-btn" id="now-prev" aria-label="上一首" title="上一首"></button>
        <button class="icon-btn play-btn" id="now-play" aria-label="播放或暂停"></button>
        <button class="icon-btn" id="now-next" aria-label="下一首" title="下一首"></button>
        <button class="icon-btn" id="now-playlist" aria-label="歌单" aria-haspopup="dialog" title="歌单"></button>
      </div>
      <div class="bar-right">
        <span class="tag tag-quality" id="quality-tag" hidden>MP3</span>
        <button class="icon-btn icon-btn-text is-active" id="btn-lyric" aria-label="显示/隐藏歌词" aria-pressed="true" title="歌词">词</button>
        <div class="volume" id="volume">
          <button class="icon-btn" id="btn-volume" aria-label="静音" title="音量"></button>
          <div class="volume-pop">
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100" aria-label="音量">
          </div>
        </div>
      </div>
    </footer>

    <!-- ============ 布局样式选择弹窗（右上角） ============ -->
    <div class="lp-scrim" id="lp-scrim"></div>
    <section class="layout-pop" id="layout-pop" role="dialog" aria-modal="false" aria-labelledby="lp-title" aria-hidden="true" inert>
      <header class="lp-head">
        <h2 class="lp-title" id="lp-title">播放页布局</h2>
        <p class="lp-sub">选择你喜欢的界面排布，随时可切换</p>
      </header>
      <div class="lp-options" role="radiogroup" aria-labelledby="lp-title">
        <button class="lp-opt" role="radio" data-layout="classic" aria-checked="false">
          <span class="lp-thumb lp-thumb-classic" aria-hidden="true">
            <i class="t-disc"></i><i class="t-arm"></i>
            <i class="t-lines"><b></b><b></b><b class="on"></b><b></b><b></b></i>
            <i class="t-bar"><b></b><b class="play"></b><b></b></i>
          </span>
          <span class="lp-name">经典布局<em class="lp-check" aria-hidden="true"></em></span>
          <span class="lp-desc">唱片在左 · 歌词在右 · 底部控制栏</span>
        </button>
        <button class="lp-opt" role="radio" data-layout="split" aria-checked="false">
          <span class="lp-thumb lp-thumb-split" aria-hidden="true">
            <i class="t-disc"></i><i class="t-arm"></i>
            <i class="t-meta"><b></b><b></b></i>
            <i class="t-prog"></i>
            <i class="t-ctrl"><b></b><b class="play"></b><b></b></i>
            <i class="t-lines"><b></b><b></b><b class="on"></b><b></b><b></b><b></b></i>
          </span>
          <span class="lp-name">分栏布局<em class="lp-check" aria-hidden="true"></em></span>
          <span class="lp-desc">播放器与控制在左 · 歌词在右</span>
        </button>
      </div>
    </section>

    <!-- ============ 歌单底部弹窗 ============ -->
    <div class="sheet-scrim" id="sheet-scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true" inert>
      <div class="sheet-grab" id="sheet-grab"><span></span></div>
      <header class="sheet-head" id="sheet-head">
        <div class="sheet-cover" id="sheet-cover"></div>
        <div class="sheet-now">
          <h2 class="sheet-title" id="sheet-title">本地歌单</h2>
          <p class="sheet-sub" id="sheet-sub">&nbsp;</p>
        </div>
        <span class="sheet-count" id="sheet-count"></span>
      </header>
      <div class="sheet-actions">
        <button class="sheet-action" id="sa-playall"><span class="sa-ico" data-icon="playAll"></span><span>播放全部</span></button>
        <button class="sheet-action" id="sa-mode"><span class="sa-ico" id="sa-mode-ico"></span><span id="sa-mode-label">顺序播放</span></button>
        <button class="sheet-action" id="sa-locate"><span class="sa-ico" data-icon="locate"></span><span>定位当前</span></button>
        <button class="sheet-action" id="sa-lyric"><span class="sa-ico" data-icon="lyric"></span><span id="sa-lyric-label">隐藏歌词</span></button>
      </div>
      <label class="sheet-search">
        <span class="sa-ico" data-icon="search"></span>
        <input type="search" id="sheet-search" placeholder="搜索歌名 / 歌手 / 专辑" autocomplete="off" spellcheck="false">
      </label>
      <ul class="sheet-list" id="sheet-list" role="listbox" aria-label="歌曲列表"></ul>
      <div class="sheet-empty" id="sheet-empty" hidden>没有找到匹配的歌曲</div>
    </section>
  </div>
  <script type="module" src="/js/main.mjs"></script>
</body>
</html>
